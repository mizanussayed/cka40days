apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
   name: allow-backend-to-db
   namespace: default
spec:
   podSelector: # Selects the pods to which this policy applies
     matchLabels:
       app: db-tier
   policyTypes:
   - Ingress
   ingress:
   - from:
     - podSelector: # Allows traffic from pods with label role=backend
         matchLabels:
           role: backend
     ports:
     - port: 3306