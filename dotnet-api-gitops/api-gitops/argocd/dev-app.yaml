apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dotnet-api-dev
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/mizanussyed/dotnet-api-gitops.git
    targetRevision: main
    path: kustomize/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
