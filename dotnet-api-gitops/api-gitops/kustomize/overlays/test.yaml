apiVersion: v1
data:
  init.sql: |
    -- Create users table matching Entity Framework Core naming conventions
    CREATE TABLE IF NOT EXISTS "Users" (
      "Id" SERIAL PRIMARY KEY,
      "UserName" VARCHAR(255) NOT NULL,
      "CreatedAt" TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
kind: ConfigMap
metadata:
  name: postgres-init-config
  namespace: dev
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: dev
stringData:
  CONNECTION_STRING: Host=postgres;Port=5432;Database=appdb;Username=appuser;Password=devpassword
  POSTGRES_PASSWORD: devpassword
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-api-service
  namespace: dev
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: dotnet-api
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: dev
spec:
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-api-deployment
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dotnet-api
  template:
    metadata:
      labels:
        app: dotnet-api
    spec:
      containers:
      - env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              key: CONNECTION_STRING
              name: postgres-secret
        image: mizanussayed/dotnet-api:latest
        name: api
        ports:
        - containerPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-statefulset
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  serviceName: postgres-service
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: postgres-secret
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              key: POSTGRES_DB
              name: postgres-secret
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: postgres-secret
        image: postgres:15
        name: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /docker-entrypoint-initdb.d
          name: init-db
      volumes:
      - configMap:
          name: postgres-init-config
        name: init-db
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
