apiVersion: v1
kind: Service
metadata:
  name: excelexplore-service
spec:
  type: ClusterIP
  selector:
    app: excelexplore
  ports:
    - port: 3030
      targetPort: 8080
---

# Source: excelexplore/templates/api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: excelexplore-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: excelexplore
  template:
    metadata:
      labels:
        app: excelexplore
    spec:
      containers:
        - name: api
          image: "mizanussayed/excelexplore:latest"
          ports:
            - containerPort: 8080
---